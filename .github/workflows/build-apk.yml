name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '枪战.HTML'
      - 'index.html'
      - 'three.min.js'
      - 'peerjs.min.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: 安装 Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.0.2' }

      - name: 安装 Capacitor 依赖
        run: |
          cd android
          npm init -y >/dev/null 2>&1 || true
          for i in 1 2 3; do
            npm install @capacitor/core@5 @capacitor/android@5 --no-audit --no-fund && break || { echo "npm retry $i"; sleep 8; }
          done

      - name: 拷贝仓库最新游戏文件（不再从 CDN 拉旧版）
        run: |
          set -e
          PUB=android/android/app/src/main/assets/public
          mkdir -p "$PUB"
          cp 枪战.HTML "$PUB/index.html"
          cp index.html "$PUB/index.html"
          cp three.min.js "$PUB/" 2>/dev/null || true
          cp peerjs.min.js "$PUB/" 2>/dev/null || curl -sL -o "$PUB/peerjs.min.js" https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js
          cp sw.js "$PUB/" 2>/dev/null || true
          cp manifest.json "$PUB/" 2>/dev/null || true
          cp icon-192.png icon-512.png icon-180.png "$PUB/" 2>/dev/null || true
          ls -la "$PUB"
          echo "index.html 大小: $(wc -c < "$PUB/index.html")"

      - name: 允许 HTTP 明文流量
        run: |
          MANIFEST=android/android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"

      - name: 构建 Debug APK
        run: |
          cd android/android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== BUILD FAILED ==="; tail -200 build_log.txt; exit 1
          fi

      - name: 重命名 APK
        run: |
          mkdir -p release
          cp android/android/app/build/outputs/apk/debug/app-debug.apk release/fangkuai-tuji-v342.apk
          ls -la release/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fangkuai-tuji-v342-apk
          path: release/fangkuai-tuji-v342.apk
          if-no-files-found: error

      - name: 发布到 Release v3.4.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.2
          name: 方块突击 v3.4.2
          body: |
            ## 方块突击 v3.4.2

            ### 手机版（Android APK）
            下载 **fangkuai-tuji-v342.apk** 后安装即可（需允许安装未知来源）。
            - 修复设置闪退、返回主菜单卡死、画面模糊
            - 远程联机：托管房间列表、密码锁、随机进入、无密码直进、复制快捷网址
            - 手机专属暖色界面，固定横屏
            - 新增火箭筒（5）、手雷改 6，手雷伤害修复
          files: release/fangkuai-tuji-v342.apk
          fail_on_unmatched_files: true
