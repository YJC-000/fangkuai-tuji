name: Build APK

# 【自动合成 APK】推送到 main 或手动触发后，GitHub 自动把网页游戏打包成 APK
# v3.1 版：修复 sed 匹配（AndroidManifest 中 <application 后是换行，改为前缀匹配）
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17（Android 构建需要）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: 安装 Capacitor Android 依赖（供 :capacitor-android 模块解析）
        run: |
          cd android
          npm init -y >/dev/null 2>&1 || true
          for i in 1 2 3; do
            npm install @capacitor/core@5 @capacitor/android@5 --no-audit --no-fund && break || { echo "npm 第 $i 次失败，10 秒后重试"; sleep 10; }
          done

      - name: 拷贝游戏文件到 Web 资源目录
        run: |
          mkdir -p android/android/app/src/main/assets/public
          cp 枪战.HTML android/android/app/src/main/assets/public/index.html
          cp three.min.js android/android/app/src/main/assets/public/ 2>/dev/null || true
          cp qrcode.min.js android/android/app/src/main/assets/public/ 2>/dev/null || true
          cp server.js android/android/app/src/main/assets/public/ 2>/dev/null || true
          ls -la android/android/app/src/main/assets/public

      - name: 允许 HTTP 明文流量（连局域网 ws:// 服务器必需）
        run: |
          MANIFEST=android/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          grep -o 'usesCleartextTraffic="true"' "$MANIFEST"

      - name: 构建 Debug APK
        run: |
          cd android/android
          gradle assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 方块突击-APK
          path: android/android/app/build/outputs/apk/debug/*.apk
