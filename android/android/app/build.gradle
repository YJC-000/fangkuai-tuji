apply plugin: 'com.android.application'

android {
    namespace 'com.yjc.fangkuaituji'
    compileSdk 35

    defaultConfig {
        applicationId "com.yjc.fangkuaituji"
        minSdk 24
        targetSdk 35
        versionCode 309
        versionName "3.0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
