name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: 安装 Capacitor 依赖
        run: |
          cd android
          npm init -y >/dev/null 2>&1 || true
          for i in 1 2 3; do
            npm install @capacitor/core@5 @capacitor/android@5 --no-audit --no-fund && break || { echo "npm retry $i"; sleep 10; }
          done

      - name: 下载最新 V3.2.0 游戏文件
        run: |
          curl -sL -o 枪战.HTML https://aka.doubaocdn.com/s/l6iTCYDzVV
          ls -la 枪战.HTML

      - name: 拷贝游戏文件
        run: |
          mkdir -p android/android/app/src/main/assets/public
          cp 枪战.HTML android/android/app/src/main/assets/public/index.html
          cp three.min.js android/android/app/src/main/assets/public/ 2>/dev/null || true
          curl -sL -o android/android/app/src/main/assets/public/peerjs.min.js https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js
          cp qrcode.min.js android/android/app/src/main/assets/public/ 2>/dev/null || true

      - name: 允许 HTTP 明文流量
        run: |
          MANIFEST=android/android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"

      - name: 构建 Debug APK
        run: |
          cd android/android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== BUILD FAILED ==="
            tail -200 build_log.txt
            exit 1
          fi

      - name: Push APK
        run: |
          mkdir -p releases
          cp android/android/app/build/outputs/apk/debug/app-debug.apk releases/fangkuai-tuji-v320.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/fangkuai-tuji-v320.apk
          git commit -m "V3.2.0 APK auto push" || echo "no change"
          git push origin main

      - name: 失败时推送日志
        if: failure()
        run: |
          cp android/android/build_log.txt build_error.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_error.log 2>/dev/null || true
          git commit -m "build error log" || echo "no change"
          git push origin main || true
